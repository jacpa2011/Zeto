<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Difficulty Game</title>
    <link rel="stylesheet" href="css.css">
</head>
<body onload="Get()">
    <div id="difficulty-container">
        <p id="difficultyname">Difficulty Name</p>
        <img src="Difficulties/-1/Tfird.png" id="Difficulty" />
    </div>
    <div>
        <div id="left-side-container">
                <div id="image-container">
                <img src="divider.png" id="divider" />
            </div>
            <div class="display existencerankdisplay">Your existence rank is currently: existence-<span id="existencerank" style="font-style: italic; color: red; filter: blur(1px);"></span></div>
        </div>
    <div id="right-side-container">
        <button id="Action1" class="voidbutton" onclick="Action(1)">
            <p>Take in Energy from <span id="random1" style="font-style: italic;"></span></p>
        </button>
        <div id="action1progressbar">
            <div id="action1pbui"></div>
        </div>
        <p id="energydisplay" class="display">Energy: <span id="energy"></span> pJ</p>
        <div id="traceupgrades">
            <button class="voidbutton" id="up1" onclick="BuyEnergyUp(1)">
                <div class="up-name">&lt;Mitosis|</div>
                <div class="up-desc">Duplicate yourself to do an action multiple times in one go.</div>
                <div class="up-eff">Effect: x<span id="up1-eff"></span> Energy</div>
                <div class="up-cost">Cost: <span id="up1-cost"></span> pJ</div>
                <div class="up-amt">Level: <span id="up1-lvl"></span> / ∞</div>
            </button>
            <button class="voidbutton" id="up2" onclick="BuyEnergyUp(2)">
                <div class="up-name">&lt;Applied Knowledge|</div>
                <div class="up-desc">Concentrate previous experiences to get more Energy. <br> The total amount of times you did an action multiplies Energy.</div>
                <div class="up-eff">Effect: x<span id="up2-eff"></span> Energy</div>
                <div class="up-cost">Cost: <span id="up2-cost"></span> pJ</div>
            </button>
            <button class="voidbutton" id="up3" onclick="BuyEnergyUp(3)">
                <div class="up-name">&lt;Temporal Continuum|</div>
                <div class="up-desc">Create a constant heartbeat within you. Discover Time.</div>
                <div class="up-cost">Cost: <span id="up3-cost"></span> pJ</div>
            </button>
        </div>
        <div id="Time">
            <p id="TimeTitle">Time</p>
            <p class="display">Rate: <span id="rate"></span> /s</p>
            <p class="display">Time Passed: <span id="seconds"></span>s</p>
        </div>
    </div>
    </div>
    <div id="bottom-gradient"></div>
    <script src="break_eternity.js"></script>
    <script src="numberformatting.js"></script>
    <script src="save.js"></script>
    <script src="shortcut.js"></script>
    <script src="main.js"></script>
    <script src="gameloop.js"></script>
</body>
</html>
